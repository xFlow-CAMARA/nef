name: invoker-onboarding tests

on:
  push:
    branches: [alis-poc, main]
    paths: ['invoker-onboarding/**', '.github/workflows/invoker-onboarding-tests.yml']
  pull_request:
    paths: ['invoker-onboarding/**', '.github/workflows/invoker-onboarding-tests.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoker-onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          pip install ruff==0.6.9
          ruff check .
      - name: Run tests
        env:
          APP_ENV: dev
          FIELD_KEY_PASSPHRASE: ci-test-key
        run: pytest -q
